[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppr-graphrag"
version = "0.1.0"
description = "Minimal GraphRAG / Personalized PageRank RAG research skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
  "datasets",
  "numpy",
  "pandas",
  "networkx",
  "openai",
  "tqdm",
  "scikit-learn",
  "rank-bm25",
  "sentence-transformers",
  "faiss-cpu",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["ppr_graphrag*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
