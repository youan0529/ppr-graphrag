experiment:
  project_name: ppr_graphrag
  run_name: toy
  seed: 13
  output_dir: experiments

llm:
  provider: openai_compatible
  model: gpt-oss:20b
  base_url: http://localhost:11434/v1
  base_urls: []
  api_key: ollama
  temperature: 0.0
  max_tokens: 256
  timeout: 120.0
  reasoning_effort: low
  cache_enabled: true
  cache_path: cache/llm.sqlite

embedding:
  provider: sentence_transformers
  model_name_or_path: sentence-transformers/all-MiniLM-L6-v2
  device: null
  batch_size: 16
  normalize: true
  cache_enabled: true
  cache_path: cache/embedding.sqlite

data:
  corpus_path: data/toy/corpus.jsonl
  queries_path: data/toy/queries.jsonl
  chunk_size: 256
  chunk_overlap: 32

graph:
  graph_path: artifacts/graph.pkl
  directed: false
  add_self_loops: false
  extraction_prompt_path: prompts/extract_passage.md
  extraction_workers: 1
  entity_similarity_threshold: 0.8

retrieval:
  method: bm25
  top_k: 3
  dense_candidate_k: 100
  ppr_fact_seed_k: 20
  ppr_entity_seed_k: 10
  entity_seed_threshold: 0.5
  fact_seed_weight: 0.8
  ppr_alpha: 0.85
  ppr_max_iter: 100
  ppr_tol: 1.0e-6

resume:
  resume_index: true
  resume_retrieval: true
  force_rebuild_index: false
  force_retrieve: false
